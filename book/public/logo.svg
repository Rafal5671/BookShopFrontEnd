<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .book-logo-text {
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
    .book-logo-subtext {
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
  </style>
  <!-- Book Icon -->
  <g fill="none" stroke="#00AEEF" stroke-width="8">
    <path d="M50 80 Q75 60 100 80 T150 80" />
    <path d="M50 100 Q75 80 100 100 T150 100" />
    <path d="M50 120 Q75 100 100 120 T150 120" />
  </g>
  <!-- Text -->
  <text x="50" y="150" fill="#00AEEF" class="book-logo-text" font-size="24">BookLogo</text>
  <text x="70" y="170" fill="#00AEEF" class="book-logo-subtext">education</text>
</svg>
